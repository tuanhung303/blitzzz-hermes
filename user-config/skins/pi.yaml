name: pi
description: "Clean minimal — grayscale, no flashy colors, no emoji, no visible borders, static spinner"
colors:
  banner_border: "#141417"
  banner_title: "#e4e4e7"
  banner_accent: "#a1a1aa"
  banner_dim: "#4a4a52"
  banner_text: "#c8c8d0"
  ui_accent: "#a1a1aa"
  ui_label: "#8a8a92"
  ui_ok: "#9a9aa2"
  ui_error: "#d0d0d8"
  ui_warn: "#b0b0b8"
  prompt: "#e4e4e7"
  input_rule: "#26262b"
  response_border: "#141417"
  status_bar_bg: ""
  status_bar_text: "#d4d4d8"
  status_bar_strong: "#e4e4e7"
  status_bar_dim: "#71717a"
  status_bar_good: "#b0b0b8"
  status_bar_warn: "#9a9aa2"
  status_bar_bad: "#d0d0d8"
  status_bar_critical: "#e0e0e8"
  session_label: "#8a8a92"
  session_border: "#26262b"
  completion_menu_bg: "#1e1e22"
  completion_menu_current_bg: "#2a2a30"
  completion_menu_meta_bg: "#1e1e22"
  completion_menu_meta_current_bg: "#2a2a30"
spinner:
  # All faces identical -> static spinner, zero animation jitter.
  waiting_faces: ["(·)", "(·)", "(·)"]
  # Blank face + formatter support renders the compact "working..." label.
  thinking_faces: ["", "", ""]
  # Single fixed verb -> spinner line never changes width, zero repaint jitter.
  thinking_verbs: ["working", "working", "working"]
  wings: [["·", "·"], ["·", "·"]]
branding:
  agent_name: "Hermes"
  welcome: "Type a message or /help for commands."
  goodbye: "Goodbye."
  response_label: " hermes "
  prompt_symbol: "❯"
  help_header: "Available Commands"
tool_prefix: "·"
# Empty-out every tool emoji (single space is truthy, so it wins over the
# registry defaults; an empty string would fall through to the registry).
